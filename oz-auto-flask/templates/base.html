<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Автосервисы Орехово-Зуево{% endblock %}</title>
  <meta name="description" content="Каталог автосервисов, шиномонтажа, автоэлектрики, детейлинга и магазинов запчастей в Орехово-Зуево.">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div>
        <a class="logo" href="{{ url_for('index') }}">АвтоКаталог OZ</a>
        <div class="subtitle">Каталог автосервисов и смежных услуг</div>
      </div>
      <nav>
        <a href="{{ url_for('index') }}">Каталог</a>
      </nav>
    </div>
  </header>

  <main class="container page-content">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
